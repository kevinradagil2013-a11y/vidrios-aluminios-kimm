services:
  - type: web
    name: kimm-contact-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm --workspace services/contact run build
    startCommand: npm --workspace services/contact run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: DATABASE_URL
        fromDatabase:
          name: kimm-postgres
          property: connectionString

  - type: web
    name: vidrios-aluminios-kimm
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm --workspace apps/frontend run build
    staticPublishPath: ./apps/frontend/dist
    envVars:
      - key: VITE_CONTACT_API_URL
        value: https://kimm-contact-api.onrender.com

databases:
  - name: kimm-postgres
    plan: free
