services:

  postgres:
    image: postgres:17
    container_name: kimm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kimm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - kimm-postgres-data:/var/lib/postgresql/data

  contact-api:
    build:
      context: .
      dockerfile: services/contact/Dockerfile
    container_name: kimm-contact-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3107
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kimm
    ports:
      - "3107:3107"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_CONTACT_API_URL: http://localhost:3107
    container_name: kimm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - contact-api

volumes:
  kimm-postgres-data: